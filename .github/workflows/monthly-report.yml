name: Scaffold monthly OSS report

# Runs scripts/generate-report.mjs to scaffold next month's report as a
# content/notes/*.mdx file (already status: "Published"), then opens a PR
# so Advith can review/edit the AI-drafted narrative before merging.
# Reviewing and merging the PR *is* the publish step — nothing reaches the
# live site until then, since the branch it's opened from is never deployed
# on its own. See scripts/generate-report.mjs for details on what it
# scaffolds and why.
#
# The script also drafts a per-repo narrative paragraph via GitHub Models
# (free, hosted by GitHub) — that needs the `models: read` permission below
# so the automatic secrets.GITHUB_TOKEN can call it. No extra secret to set up.

on:
  schedule:
    # 06:00 UTC on the 1st of every month — covers the just-finished month.
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      month:
        description: 'Target month as YYYY-MM (defaults to last full month)'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  scaffold-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate draft report
        id: generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-report.mjs ${{ inputs.month }}

      - name: Open PR with the draft
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: scaffold monthly OSS report'
          branch: monthly-report/${{ github.run_id }}
          title: ${{ steps.generate.outputs.title }}
          body: |
            Auto-scaffolded by `.github/workflows/monthly-report.yml` via
            `scripts/generate-report.mjs`. Stats are pulled from GitHub's
            Search API and are a starting point, not ground truth — read
            through the paragraphs marked "AI-drafted" (written by GitHub
            Models) and fix anything that misses the real reason the work
            mattered. This file is already `status: "Published"` — merging
            this PR is what makes it live, there's no separate flag to flip
            afterward.
          add-paths: content/notes/*.mdx
